interface:
  display_name: "Orchestrate"
  short_description: "Design and run live, steerable workflow graphs"
  default_prompt: "Use $orchestrate to design a validated YAML workflow, present its approval digest, wait for approval, start the run, and report the run ID. When Herdr wakes this agent about a workflow node, run orchestrate reconcile to advance the workflow."
policy:
  allow_implicit_invocation: true
