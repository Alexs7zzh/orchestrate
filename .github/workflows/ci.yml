name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify-orchestrate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: scripts
        run: bun install --frozen-lockfile
      - name: Install Fish completion test dependency
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # The runner image ships aws/tap, which Homebrew's tap-trust check
          # now warns about; we only need homebrew/core.
          brew untap aws/tap 2>/dev/null || true
          brew install fish
      - name: Format, lint, typecheck, build, and test source plus packaged contract
        working-directory: scripts
        run: bun run verify
      - name: Committed schemas match the source
        working-directory: scripts
        run: |
          git diff --exit-code -- \
            ../references/workflow.schema.json \
            ../references/preferences.schema.json \
            ../references/state.schema.json \
            ../references/event.schema.json \
            src/herdr-api.generated.ts
