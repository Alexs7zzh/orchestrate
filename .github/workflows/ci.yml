name: CI

on:
  push:
  pull_request:

jobs:
  verify-orchestrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: scripts
        run: bun install --frozen-lockfile
      - name: Verify production import manifest closure
        working-directory: scripts
        run: bun run check:production-dependencies
      - name: Format, lint, typecheck, build, and test source plus packaged contract
        working-directory: scripts
        run: bun run verify
      - name: Committed build artifacts match the source
        working-directory: scripts
        run: |
          git diff --exit-code -- \
            orchestrate.mjs \
            ../references/workflow.schema.json \
            ../references/preferences.schema.json \
            ../references/state.schema.json \
            ../references/event.schema.json
