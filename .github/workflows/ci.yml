name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify-orchestrate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: scripts
        run: bun install --frozen-lockfile
      - name: Install Fish completion test dependency
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install fish
      - name: Format, lint, typecheck, build, and test source plus packaged contract
        working-directory: scripts
        run: bun run verify
      - name: Committed schemas match the source
        working-directory: scripts
        run: |
          git diff --exit-code -- \
            ../references/workflow.schema.json \
            ../references/preferences.schema.json \
            ../references/state.schema.json \
            ../references/event.schema.json
