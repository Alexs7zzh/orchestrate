name: Build release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS ARM64 release
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Assert native ARM64 runner
        run: test "$(uname -m)" = arm64
      - name: Require the tagged commit to belong to main
        run: |
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "Release tag must point to a commit on main." >&2
            exit 1
          fi
      - name: Derive the release version from the tag
        id: version
        run: |
          test "$GITHUB_REF_TYPE" = tag
          case "$GITHUB_REF_NAME" in v*) ;; *) echo "Release tag must be v<semver>." >&2; exit 1 ;; esac
          VERSION="${GITHUB_REF_NAME#v}"
          ORCHESTRATE_TAG_VERSION="$VERSION" bun -e 'import { assertReleaseVersion } from "./scripts/src/semver.ts"; assertReleaseVersion(process.env.ORCHESTRATE_TAG_VERSION ?? "")'
          echo "ORCHESTRATE_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install
        working-directory: scripts
        run: bun install --frozen-lockfile
      - name: Install Fish completion test dependency
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # The runner image ships aws/tap, which Homebrew's tap-trust check
          # now warns about; we only need homebrew/core.
          brew untap aws/tap 2>/dev/null || true
          brew install fish
      - name: Verify source and compiled release payload
        working-directory: scripts
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: bun run verify
      - name: Package staged payload
        working-directory: scripts
        env:
          ORCHESTRATE_RELEASE_REPOSITORY: ${{ github.repository }}
          ORCHESTRATE_RELEASE_OUTPUT: ${{ github.workspace }}/release
        run: bun run release:assemble
      - name: Build Homebrew bottle and add its stanza to the formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          # Installing a local formula file is our own CI exercising our own
          # release; the tap-trust prompt does not apply.
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          set -euo pipefail
          # Install the rendered formula from the locally assembled tarball,
          # then let brew produce a real bottle of the resulting keg. Homebrew
          # only installs formulae that live in a tap, so stage the
          # rewritten formula in a throwaway local tap.
          brew tap-new --no-git local/release
          sed "s|^  url .*|  url \"file://$GITHUB_WORKSPACE/release/orchestrate-macos-arm64.tar.gz\"|" \
            release/orchestrate.rb > "$(brew --repository)/Library/Taps/local/homebrew-release/Formula/orchestrate.rb"
          brew install --build-bottle --ignore-dependencies local/release/orchestrate
          brew bottle --json --no-rebuild \
            --root-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            local/release/orchestrate
          BOTTLE_JSON=(orchestrate--*.bottle.json)
          test "${#BOTTLE_JSON[@]}" -eq 1
          TAG="$(jq -r '.["local/release/orchestrate"].bottle.tags | keys[0]' "${BOTTLE_JSON[0]}")"
          case "$TAG" in arm64_*) ;; *) echo "Unexpected bottle tag: $TAG" >&2; exit 1 ;; esac
          CELLAR="$(jq -r ".[\"local/release/orchestrate\"].bottle.tags[\"$TAG\"].cellar" "${BOTTLE_JSON[0]}")"
          BOTTLE_SHA="$(jq -r ".[\"local/release/orchestrate\"].bottle.tags[\"$TAG\"].sha256" "${BOTTLE_JSON[0]}")"
          BOTTLE_FILENAME="$(jq -r ".[\"local/release/orchestrate\"].bottle.tags[\"$TAG\"].filename" "${BOTTLE_JSON[0]}")"
          LOCAL_FILENAME="$(jq -r ".[\"local/release/orchestrate\"].bottle.tags[\"$TAG\"].local_filename" "${BOTTLE_JSON[0]}")"
          # Mirror brew's own relocatability judgement while preserving its
          # macOS/architecture tag in both the formula and release filename.
          case "$CELLAR" in
            :*) SHA_LINE="    sha256 cellar: $CELLAR, ${TAG}: \"$BOTTLE_SHA\"" ;;
            null) SHA_LINE="    sha256 ${TAG}: \"$BOTTLE_SHA\"" ;;
            /opt/homebrew/Cellar)
              SHA_LINE="    sha256 cellar: \"/opt/homebrew/Cellar\", ${TAG}: \"$BOTTLE_SHA\""
              ;;
            *) echo "Unexpected bottle cellar: $CELLAR" >&2; exit 1 ;;
          esac
          mv "$LOCAL_FILENAME" "release/$BOTTLE_FILENAME"
          shasum -a 256 -c <(echo "$BOTTLE_SHA  release/$BOTTLE_FILENAME")
          awk -v url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            -v shaline="$SHA_LINE" '
            { print }
            /^  license / {
              print ""
              print "  bottle do"
              print "    root_url \"" url "\""
              print shaline
              print "  end"
            }' release/orchestrate.rb > release/orchestrate.rb.bottled
          mv release/orchestrate.rb.bottled release/orchestrate.rb
          grep -A3 "bottle do" release/orchestrate.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: orchestrate-macos-arm64
          path: |
            release/orchestrate-macos-arm64.tar.gz
            release/orchestrate-macos-arm64.tar.gz.sha256
            release/orchestrate-*.bottle.tar.gz
            release/orchestrate.rb
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create draft GitHub release
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: orchestrate-macos-arm64
          path: release
      - name: Create or refresh the reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ORCHESTRATE_RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          BOTTLES=(release/orchestrate-*.bottle.tar.gz)
          if [ "${#BOTTLES[@]}" -ne 1 ] || [ ! -f "${BOTTLES[0]}" ]; then
            echo "Expected exactly one platform-tagged Homebrew bottle." >&2
            exit 1
          fi
          ASSETS=(
            release/orchestrate-macos-arm64.tar.gz
            release/orchestrate-macos-arm64.tar.gz.sha256
            "${BOTTLES[0]}"
            release/orchestrate.rb
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != true ]; then
              echo "Release $GITHUB_REF_NAME is already published; refusing to replace its assets." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            FLAGS=(--draft --verify-tag --generate-notes --title "Orchestrate $ORCHESTRATE_RELEASE_VERSION")
            if [[ "$ORCHESTRATE_RELEASE_VERSION" == *-* ]]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" "${FLAGS[@]}"
          fi
