name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the selected tag after building and verifying"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "orchestrate-*"

jobs:
  macos-arm64:
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Assert native ARM64 runner
        run: test "$(uname -m)" = arm64
      - name: Derive the release version from the tag
        run: |
          test "$GITHUB_REF_TYPE" = tag
          case "$GITHUB_REF_NAME" in orchestrate-*) ;; *) echo "Release tag must be orchestrate-<semver>." >&2; exit 1 ;; esac
          VERSION="${GITHUB_REF_NAME#orchestrate-}"
          ORCHESTRATE_TAG_VERSION="$VERSION" bun -e 'import { assertReleaseVersion } from "./scripts/src/semver.ts"; assertReleaseVersion(process.env.ORCHESTRATE_TAG_VERSION ?? "")'
          echo "ORCHESTRATE_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Install
        working-directory: scripts
        run: bun install --frozen-lockfile
      - name: Verify and compile
        working-directory: scripts
        run: |
          bun run verify
          bun run build:compile
      - name: Package staged payload
        working-directory: scripts
        env:
          ORCHESTRATE_RELEASE_REPOSITORY: ${{ github.repository }}
          ORCHESTRATE_RELEASE_OUTPUT: ${{ github.workspace }}/release
        run: bun run release:assemble
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrate-macos-arm64
          path: |
            release/orchestrate-macos-arm64.tar.gz
            release/orchestrate-macos-arm64.tar.gz.sha256
            release/orchestrate.rb
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_type == 'tag'
    needs: macos-arm64
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orchestrate-macos-arm64
          path: release
      - name: Publish explicitly authorized tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/orchestrate-macos-arm64.tar.gz \
            release/orchestrate-macos-arm64.tar.gz.sha256 \
            release/orchestrate.rb \
            --verify-tag \
            --generate-notes
