id = "orchestrate"
name = "Orchestrate"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Open the Orchestrate workflow board and pause or resume runs through the crank CLI."
platforms = ["macos"]

# herdr resolves command argv[0] via PATH (the plugin root is only the cwd),
# so the entrypoint script is passed to `sh` as a relative argument.
[[panes]]
id = "board"
title = "Orchestrate board"
placement = "tab"
command = ["sh", "bin/orchestrate-panel"]

[[actions]]
id = "pause-latest"
title = "Orchestrate: pause the most recent active run"
command = ["sh", "bin/orchestrate-panel", "pause"]

[[actions]]
id = "resume-latest"
title = "Orchestrate: resume the most recent paused run"
command = ["sh", "bin/orchestrate-panel", "resume"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "bin/orchestrate-panel", "herdr-event"]
